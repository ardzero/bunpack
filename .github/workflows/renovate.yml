name: Renovate

# Self-hosted Renovate: free on public repos (GitHub Actions minutes are unlimited).
# Runs every 4 hours so automerges and Dependency Dashboard checkboxes are picked up
# promptly; renovate.json's `schedule` still limits new PRs to Monday mornings (UTC).
#
# Setup (one time): create a GitHub App, install it on this repo, then add
#   - repository variable  RENOVATE_APP_CLIENT_ID
#   - repository secret    RENOVATE_APP_PRIVATE_KEY
# See .github/RENOVATE.md for the exact app permissions.

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options:
          - info
          - debug

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    # Don't run (and fail) in forks that enable Actions.
    if: github.repository == 'ardzero/bunpack'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.257.9
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Commit through the GitHub API so commits are signed/verified as the app.
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
